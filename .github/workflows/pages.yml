name: Publish approved website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir public
          cp index.html public/
          mkdir public/web
          for file in style.css releases.js favicon.svg community.html community.css community.js; do
            cp "web/$file" public/web/
          done
          if test -f version.json; then cp version.json public/; fi
          if test -f CNAME; then cp CNAME public/; fi
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
